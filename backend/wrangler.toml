name = "maa-maternal-assistance-app"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "maa-db"
# Run `wrangler d1 create maa-db` and paste the real id here.
database_id = "74406c84-3cca-4033-a33d-135e8a30be4b"
migrations_dir = "migrations"

# Secrets (never commit): set with `wrangler secret put <NAME>`
#   JWT_SECRET      long random string (>= 32 chars)
#   ADMIN_API_KEY   platform-admin key, used only to verify facilities
